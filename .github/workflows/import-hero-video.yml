name: Import native GTA IV hero video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-hero-video.yml"

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Resolve and download the high-quality source without embedding YouTube
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-video assets/videos
          VIDEO_ID="6GkRXC0p9Zc"
          META="/tmp/gta-video/video.json"
          VIDEO_URL=""

          for API in             "https://inv.nadeko.net"             "https://invidious.nerdvpn.de"             "https://yt.chocolatemoo53.com"             "https://invidious.tiekoetter.com"
          do
            echo "Trying $API"
            if curl --retry 2 --connect-timeout 15 -fsSL               -A "Mozilla/5.0"               "$API/api/v1/videos/$VIDEO_ID"               -o "$META"; then

              VIDEO_URL="$(jq -r '
                (
                  [.adaptiveFormats[]?
                    | select(.url != null)
                    | select((.type // "") | startswith("video/"))
                    | . + {h: ((.qualityLabel // .quality // "0") | capture("(?<n>[0-9]+)")?.n // "0" | tonumber)}
                    | select(.h <= 1080)
                  ]
                  | sort_by(.h)
                  | reverse
                  | .[0].url
                )
                //
                (
                  [.formatStreams[]?
                    | select(.url != null)
                    | . + {h: ((.qualityLabel // .resolution // .quality // "0") | capture("(?<n>[0-9]+)")?.n // "0" | tonumber)}
                    | select(.h <= 1080)
                  ]
                  | sort_by(.h)
                  | reverse
                  | .[0].url
                )
                // empty
              ' "$META")"

              if [ -n "$VIDEO_URL" ] && [ "$VIDEO_URL" != "null" ]; then
                break
              fi
            fi
          done

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "Could not resolve a native stream URL."
            exit 1
          fi

          echo "Downloading resolved stream..."
          curl --retry 5 --retry-all-errors --connect-timeout 20 -fL             -A "Mozilla/5.0"             "$VIDEO_URL"             -o /tmp/gta-video/source-video

          test -s /tmp/gta-video/source-video
          ffprobe -v error -show_entries stream=width,height,codec_name -of json /tmp/gta-video/source-video

      - name: Trim all Rockstar/legal intro screens and optimize for native web playback
        run: |
          ffmpeg -y -ss 28.85 -i /tmp/gta-video/source-video             -an             -vf "fps=24,scale=1920:-2:flags=lanczos"             -c:v libx264 -preset faster -crf 18             -pix_fmt yuv420p             -movflags +faststart             assets/videos/gta-loading.mp4

          test -s assets/videos/gta-loading.mp4
          ls -lh assets/videos/gta-loading.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of json assets/videos/gta-loading.mp4

      - name: Commit native hero video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/gta-loading.mp4
          if git diff --cached --quiet; then
            echo "Video already up to date."
            exit 0
          fi
          git commit -m "Add native GTA IV loading-screen hero video"
          git push
