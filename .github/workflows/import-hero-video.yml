name: Import native GTA IV hero video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-hero-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Resolve a direct native stream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-video assets/videos
          VIDEO_ID="6GkRXC0p9Zc"
          VIDEO_URL=""
          JSON="/tmp/gta-video/streams.json"

          APIS=(
            "https://pipedapi.rivo.lol"
            "https://piped-api.lunar.icu"
            "https://ytapi.dc09.ru"
            "https://pipedapi.colinslegacy.com"
            "https://yapi.vyper.me"
            "https://api.looleh.xyz"
            "https://piped-api.cfe.re"
            "https://pipedapi.r4fo.com"
            "https://pipedapi.wireway.ch"
            "https://pipedapi-libre.kavin.rocks"
            "https://pa.mint.lgbt"
            "https://pa.il.ax"
            "https://piped-api.privacy.com.de"
            "https://api.piped.projectsegfau.lt"
            "https://pipedapi.in.projectsegfau.lt"
            "https://pipedapi.us.projectsegfau.lt"
            "https://watchapi.whatever.social"
            "https://api.piped.privacydev.net"
            "https://pipedapi.palveluntarjoaja.eu"
            "https://pipedapi.smnz.de"
            "https://pipedapi.adminforge.de"
            "https://pipedapi.qdi.fi"
            "https://piped-api.hostux.net"
            "https://pdapi.vern.cc"
            "https://pipedapi.pfcd.me"
            "https://pipedapi.frontendfriendly.xyz"
            "https://api.piped.yt"
            "https://pipedapi.astartes.nl"
            "https://pipedapi.osphost.fi"
            "https://pipedapi.simpleprivacy.fr"
            "https://pipedapi.drgns.space"
            "https://piapi.ggtyler.dev"
            "https://api.watch.pluto.lat"
            "https://piped-backend.seitan-ayoub.lol"
            "https://pipedapi.owo.si"
            "https://pipedapi.12a.app"
            "https://api.piped.minionflo.net"
            "https://pipedapi.tokhmi.xyz"
            "https://pipedapi.moomoo.me"
            "https://api-piped.mha.fi"
            "https://pipedapi.kavin.rocks"
            "https://pipedapi.leptons.xyz"
          )

          for API in "${APIS[@]}"; do
            echo "Trying $API"
            if curl -k --retry 1 --connect-timeout 5 --max-time 12 -fsSL                 -A "Mozilla/5.0"                 "$API/streams/$VIDEO_ID" -o "$JSON"; then
              if ! jq -e . "$JSON" >/dev/null 2>&1; then
                echo "Non-JSON response from $API; skipping."
                continue
              fi
              VIDEO_URL="$(jq -r '
                [.videoStreams[]?
                  | select(.url != null)
                  | ((.quality // "0") | gsub("[^0-9]"; "") | tonumber? // 0) as $h
                  | select($h <= 1080 and $h >= 720)
                  | . + {h: $h}
                ]
                | sort_by(.h)
                | reverse
                | .[0].url // empty
              ' "$JSON")"
              if [ -n "$VIDEO_URL" ] && [ "$VIDEO_URL" != "null" ]; then
                echo "Resolved via $API"
                break
              fi
            fi
          done

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "Could not resolve native stream."
            exit 1
          fi

          curl -k --retry 5 --retry-all-errors --connect-timeout 20 -fL             -A "Mozilla/5.0"             "$VIDEO_URL"             -o /tmp/gta-video/source-video

          test -s /tmp/gta-video/source-video
          ffprobe -v error -show_entries stream=width,height,codec_name -of json /tmp/gta-video/source-video

      - name: Remove intro and optimize for native web playback
        run: |
          set -euo pipefail
          ffmpeg -y -ss 28.85 -i /tmp/gta-video/source-video             -an             -vf "fps=24,scale=1920:-2:flags=lanczos"             -c:v libx264 -profile:v high -level 4.1 -pix_fmt yuv420p             -preset medium -crf 19             -movflags +faststart             assets/videos/gta-loading.mp4

          ffmpeg -y -ss 0.4 -i assets/videos/gta-loading.mp4             -frames:v 1 -q:v 2 assets/videos/gta-loading-poster.jpg

          test -s assets/videos/gta-loading.mp4
          test -s assets/videos/gta-loading-poster.jpg
          ls -lh assets/videos/gta-loading.*

      - name: Commit native video assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/gta-loading.mp4 assets/videos/gta-loading-poster.jpg
          if git diff --cached --quiet; then
            echo "Video already current."
            exit 0
          fi
          git commit -m "Add native GTA IV loading-screen hero video"
          git push
