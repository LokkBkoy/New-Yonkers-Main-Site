name: Import native GTA IV hero video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-hero-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl unzip
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade --pre "yt-dlp[default,curl-cffi]"

      - name: Download exact uploaded-video source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gta-video assets/videos
          URL="https://www.youtube.com/watch?v=6GkRXC0p9Zc"

          yt-dlp             --no-playlist             --js-runtimes "deno:$HOME/.deno/bin/deno"             --impersonate chrome             --extractor-args "youtube:player_client=tv,web_safari,web_embedded"             -f "bv*[height<=1080][vcodec^=avc1]/bv*[height<=1080]/best[height<=1080]"             -o "/tmp/gta-video/source.%(ext)s"             "$URL"

          SOURCE="$(find /tmp/gta-video -maxdepth 1 -type f -name 'source.*' | head -n 1)"
          test -n "$SOURCE"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries stream=width,height,codec_name -of json "$SOURCE"

      - name: Remove Rockstar/legal intro and optimize
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -ss 28.85 -i "$SOURCE"             -an             -vf "fps=24,scale=1920:-2:flags=lanczos"             -c:v libx264 -profile:v high -level 4.1 -pix_fmt yuv420p             -preset medium -crf 19             -movflags +faststart             assets/videos/gta-loading.mp4

          ffmpeg -y -ss 0.4 -i assets/videos/gta-loading.mp4             -frames:v 1 -q:v 2 assets/videos/gta-loading-poster.jpg

          test -s assets/videos/gta-loading.mp4
          test -s assets/videos/gta-loading-poster.jpg
          ls -lh assets/videos/gta-loading.*

      - name: Commit native video assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/gta-loading.mp4 assets/videos/gta-loading-poster.jpg
          if git diff --cached --quiet; then
            echo "Video already current."
            exit 0
          fi
          git commit -m "Add native GTA IV loading-screen hero video"
          git push
